name: Build

# CI, in increasing order of how long each job takes and how much it proves:
#
#   build-server  compile check on every push (seconds)
#   test-server   the unit tests and the live protocol probes (minutes)
#   race-server   the same probes under ThreadSanitizer (slower still)
#   build-web     the browser client, under emsdk (minutes, mostly cached)
#   cmake-server  the server again, through CMakeLists.txt instead of the Makefile
#   cmake-windows the Windows half of CMakeLists.txt (F1) - see that job
#
# The macOS native client is still not built here. A macOS runner would use the
# same compiler and OS as the machine that writes the code, so it would add little
# beyond a clean-checkout check while going red whenever Homebrew bumps raylib.
# Windows and the web are the opposite case: builds nobody runs by hand.

on:
  push:
  pull_request:
    branches: [ main ]

jobs:
  build-server:
    name: Compile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install build dependencies
        # An Ubuntu mirror that stops answering hangs apt with no output; one
        # sat for GitHub's 6-hour job cap. Retry and time out per request, and
        # cap the step, so a bad mirror fails in minutes and says where.
        timeout-minutes: 10
        run: |
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/80-ci-network >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y libboost-dev libboost-system-dev

      - name: Build server
        working-directory: server
        run: make

  test-server:
    name: Tests
    runs-on: ubuntu-latest
    # Generous but bounded: the probe suite is mostly deliberate sleeps (the
    # reconnect probe alone waits out a 15s mid-match grace), so it takes minutes
    # of wall clock and almost no CPU. A hang should still fail rather than burn
    # the runner's hour.
    timeout-minutes: 25
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install build dependencies
        # An Ubuntu mirror that stops answering hangs apt with no output; one
        # sat for GitHub's 6-hour job cap. Retry and time out per request, and
        # cap the step, so a bad mirror fails in minutes and says where.
        timeout-minutes: 10
        run: |
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/80-ci-network >/dev/null
          sudo apt-get update -qq
          # lsof: run_probes.sh uses it to prove the port is free between probes,
          # which is how it catches a stray server from the previous one.
          # nlohmann-json3-dev: the LOAD HARNESS needs it, the server does not -
          # loadtest.cpp includes wire.h to use the real client encoders, and
          # wire.h is built on nlohmann/json. The server hand-rolls its JSON in
          # jsonmin.h and has never had this dependency.
          sudo apt-get install -y libboost-dev libboost-system-dev lsof nlohmann-json3-dev

      - name: Build server and load harness
        working-directory: server
        run: make && make loadtest

      # The standalone C++ tests: HMAC/SHA-256 against the published vectors,
      # chunk reassembly, registry lifecycle, and the collision-grid split
      # equivalence. Seconds, and they need no server.
      - name: Unit tests
        run: ./server/test/run_all.sh

      # The CLIENT's own suite, which nothing in CI ran until there was client
      # logic worth failing over: profile.h's two storage backends and the LOCAL
      # score board. It needs no raylib - both native tests build against the
      # server's headless stub (-I../server) - and its web half lifts the real
      # EM_JS out of the committed bundle and runs it under node, so a rename in
      # profile.h that was never rebuilt into web/ fails HERE rather than in
      # somebody's browser.
      - name: Client tests
        run: ./test/run.sh

      # The live protocol probes. Each gets its own fresh gameserver (see the
      # script) because several mutate registry state that outlives them.
      - name: Protocol probes
        run: ./server/test/run_probes.sh

      # The question this job exists to answer for a DEPLOY: does the binary that
      # just built actually serve clients, over both transports, speaking the
      # protocol they expect? /status reports the tags the running server was
      # compiled with; netbin.h is what the client will be compiled with. A
      # mismatch there is the "stale server binary" class of bug that made
      # `server/Makefile` wildcard ../*.h in the first place. It also runs the
      # WebSocket smoke test - the browser build's transport had no automated
      # coverage at all before E3 - and a two-match run of the load harness.
      - name: Smoke test (protocol tags, WebSocket, load harness)
        run: ./server/test/ci_smoke.sh

      - name: Server logs on failure
        if: failure()
        run: |
          for f in "${TMPDIR:-/tmp}"/platformz-probes/*.log; do
            [ -f "$f" ] || continue
            echo "::group::$f"
            tail -n 120 "$f"
            echo "::endgroup::"
          done

  race-server:
    name: ThreadSanitizer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install build dependencies
        # An Ubuntu mirror that stops answering hangs apt with no output; one
        # sat for GitHub's 6-hour job cap. Retry and time out per request, and
        # cap the step, so a bad mirror fails in minutes and says where.
        timeout-minutes: 10
        run: |
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/80-ci-network >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y libboost-dev libboost-system-dev lsof

      # A3 established a lock order (g_connMutex > gameMutex > clientMutex >
      # udpSendMutex) that nothing but care has been enforcing. The server runs a
      # sim thread and a pool of io threads over shared maps, which is exactly
      # the shape TSan is good at, and exactly the shape where a race shows up in
      # production as "it went weird once and we never reproduced it".
      - name: Build server with ThreadSanitizer
        working-directory: server
        run: make tsan

      # halt_on_error=0 so one report does not stop the run and hide the rest;
      # the exitcode still fails the job. second_deadlock_stack gives both sides
      # of a lock-order inversion, which is the whole point of running this.
      - name: Protocol probes under TSan
        env:
          # No suppressions= here: run_probes.sh adds it, because the path has to
          # be copied somewhere without spaces first (TSAN_OPTIONS cannot quote).
          # See server/test/tsan.supp for what is suppressed and why it is only
          # four lines.
          TSAN_OPTIONS: halt_on_error=0 second_deadlock_stack=1 history_size=4
          PLATFORMZ_SERVER_BIN: gameserver-tsan
          # TSan slows the server by ~5-15x. The probes' sleeps are wall-clock, so
          # they mostly absorb it, but the idle reaper's 3s lobby timeout does not
          # - give it room rather than watching live clients get culled.
          PLATFORMZ_PROBE_SET: probe probe_cookie probe_capacity probe_directory probe_multimatch
        run: ./server/test/run_probes.sh

      - name: TSan reports on failure
        if: failure()
        run: |
          for f in "${TMPDIR:-/tmp}"/platformz-probes/*.log; do
            [ -f "$f" ] || continue
            if grep -q "WARNING: ThreadSanitizer" "$f"; then
              echo "::group::$f"
              cat "$f"
              echo "::endgroup::"
            fi
          done

  build-web:
    name: Web client
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Full history: the freshness check below compares commit dates, and a
      # shallow clone has none to compare.
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # WHY THIS JOB EXISTS, given the server is already covered.
      #
      # Not for toolchain coverage - it is for the build nobody runs. `make web`
      # needs emsdk on PATH, EMSDK_PYTHON pointed at a >=3.10 interpreter, and a
      # separate raylib compiled for PLATFORM_WEB, so it is an easy step to skip
      # for weeks. Meanwhile the browser client is a first-class target: the
      # web/ artifacts are committed and the box serves them straight off the
      # checkout. A protocol change that breaks it breaks it for real users, and
      # nothing else in CI would notice.
      - name: Install emsdk
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64
          actions-cache-folder: emsdk-cache

      # nlohmann/json, which wire.h is built on. It has to be fetched rather than
      # apt-installed: emcc has its own sysroot and does not search /usr/include,
      # so the distro package would be invisible to it. Hence the Makefile's
      # JSON_INC.
      - name: Fetch nlohmann/json
        run: |
          mkdir -p .ci-include/nlohmann
          curl -fsSL -o .ci-include/nlohmann/json.hpp \
            https://raw.githubusercontent.com/nlohmann/json/v3.11.3/single_include/nlohmann/json.hpp

      # raylib built for the web, which takes minutes and changes only when the
      # pinned version does - so it is cached on that version plus the emsdk one,
      # since the artifacts are emcc output.
      - name: Cache web raylib
        id: raylib-cache
        uses: actions/cache@v4
        with:
          path: ~/raylib
          key: raylib-web-5.5-emsdk-3.1.64

      - name: Build raylib for web
        if: steps.raylib-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch 5.5 https://github.com/raysan5/raylib.git ~/raylib
          make -C ~/raylib/src PLATFORM=PLATFORM_WEB -B

      - name: Build the web client
        run: |
          make web RAYLIB_WEB_DIR=$HOME/raylib JSON_INC="$PWD/.ci-include"
          ls -la web/

      # Compiling proves the SOURCE is buildable. It does not prove the committed
      # web/ artifacts match it - and those are what ship. See the script.
      - name: Committed bundle is newer than the protocol
        run: ./scripts/check-web-bundle-fresh.sh

  # The server through CMake. The Makefile stays what the box and the test
  # scripts build; this proves the second build of the same sources still agrees
  # with it - same source list, same shim-before-root include order.
  cmake-server:
    name: CMake server
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install build dependencies
        # An Ubuntu mirror that stops answering hangs apt with no output; one
        # sat for GitHub's 6-hour job cap. Retry and time out per request, and
        # cap the step, so a bad mirror fails in minutes and says where.
        timeout-minutes: 10
        run: |
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/80-ci-network >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y libboost-dev nlohmann-json3-dev

      - name: Configure and build (gameserver + loadtest)
        run: |
          cmake --preset server
          cmake --build --preset server -j 4

  # The Windows client, which no one can build by hand here: raylib, mbedTLS
  # and IXWebSocket fetched and built, then platformz.exe itself (F2, #93). A
  # compile check, not a play test - it proves the Winsock UDP transport and the
  # net_native.cpp split (no <windows.h> beside raylib.h) still build.
  cmake-windows:
    name: CMake Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: true   # IXWebSocket

      - name: Configure (client)
        run: cmake --preset client

      - name: Build the client
        run: cmake --build --preset client -- /m

      # The handout zip, through the same script a release uses - so its checks
      # (version resource, no DLL a player lacks, signature verified before
      # zipping) run on every push, not just on release day. No certificate
      # yet (#94), so this produces the UNSIGNED zip.
      - name: Package
        shell: pwsh
        run: ./packaging/windows/pack.ps1

      - name: Upload the zip
        uses: actions/upload-artifact@v4
        with:
          name: platformz-windows
          path: dist/PLATFORMZ-*windows-x64.zip
          if-no-files-found: error
