<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PLATFORMZ</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; color: #6ff;
                 font-family: monospace; overflow: hidden; }
    #status { position: fixed; top: 8px; left: 10px; z-index: 2; }
    canvas.emscripten { display: block; margin: 0 auto; background: #000;
                        outline: none; }
    /* Fullscreen (F): the STAGE goes fullscreen, not the canvas, and the canvas
       is stretched inside it with its 10:7 shape kept - black bars fill the rest.
       Not the canvas itself: a fullscreened canvas is sized to the whole screen
       and letterboxed by object-fit, and emscripten maps mouse positions over
       the element's full box, so every click would land off target. Here the
       canvas's box is exactly the picture, and its backing store stays 1000x700
       - the game never learns the screen changed size. */
    #stage:fullscreen         { display: flex; align-items: center;
                                justify-content: center; background: #000; }
    #stage:-webkit-full-screen { display: flex; align-items: center;
                                justify-content: center; background: #000;
                                width: 100%; height: 100%; }
    #stage:fullscreen canvas.emscripten,
    #stage:-webkit-full-screen canvas.emscripten {
      width: min(100vw, calc(100vh * 10 / 7)); height: min(100vh, calc(100vw * 7 / 10));
    }
  </style>
</head>
<body>
  <div id="status">loading…</div>
  <!-- Click the canvas to capture the mouse (pointer lock) and start audio. -->
  <div id="stage">
    <canvas class="emscripten" id="canvas" tabindex="-1"
            oncontextmenu="event.preventDefault()"></canvas>
  </div>
  <script>
    var Module = {
      canvas: document.getElementById('canvas'),
      setStatus: function (t) {
        var s = document.getElementById('status');
        if (s) s.textContent = t;
      },
      print:    function (t) { console.log(t); },
      printErr: function (t) { console.error(t); }
    };

    // Pointer lock: capture the mouse for free-look. raylib's web DisableCursor()
    // uses emscripten's *deferred* pointer-lock request, which Chrome fires on the
    // first click but Safari does not reliably trigger - so the cursor never
    // captures and the game (which gates input on IsCursorHidden()) stays
    // uncontrollable. We request it explicitly & synchronously inside the
    // mousedown gesture, which Safari honors. raylib reads the real
    // 'pointerlockchange' event, so its IsCursorHidden() state stays in sync no
    // matter who initiated the lock.
    (function () {
      var canvas = document.getElementById('canvas');
      var requestLock = canvas.requestPointerLock || canvas.webkitRequestPointerLock;
      function locked() {
        return document.pointerLockElement === canvas ||
               document.webkitPointerLockElement === canvas;
      }
      canvas.addEventListener('mousedown', function () {
        if (locked() || !requestLock) return;
        // The game sets this whenever the mouse belongs to the UI: every menu
        // screen (title, browser, lobby, setup, game over) and any open modal.
        // Without it a click on a screen made of buttons stole the pointer.
        if (window.Module && Module.uiOwnsMouse) return;
        var r = requestLock.call(canvas);
        if (r && typeof r.catch === 'function') r.catch(function () {}); // Chrome returns a Promise
      });
      // Surface the case where Safari refuses the lock (e.g. security) instead of
      // failing silently - over plain-HTTP LAN this is the most likely culprit.
      function onErr() {
        Module.setStatus('Pointer lock was blocked. In Safari, try localhost or ' +
                         'an HTTPS server; otherwise click the canvas again.');
      }
      document.addEventListener('pointerlockerror', onErr);
      document.addEventListener('webkitpointerlockerror', onErr);
    })();

    // Fullscreen: F toggles it, Esc leaves it (the browser does that part
    // itself). Handled HERE rather than in the game because a page may only go
    // fullscreen from inside the user's own key or click handler, and the game
    // reads its keys on the next animation frame - by then it no longer counts.
    // The game says whether F is free to take: Module.fullscreenKeyOk is false
    // while one of its text fields has focus, where F is just a letter (set every
    // frame by display::SetFullscreenKeyEnabled). The game calls
    // Module.exitFullscreen on Esc, in case the browser kept the key.
    (function () {
      var stage = document.getElementById('stage');
      function current() {
        return document.fullscreenElement || document.webkitFullscreenElement;
      }
      function enter() {
        var req = stage.requestFullscreen || stage.webkitRequestFullscreen;
        if (!req) return;
        var r = req.call(stage);
        if (r && typeof r.catch === 'function') r.catch(function () {});
      }
      function exit() {
        if (!current()) return;
        var ex = document.exitFullscreen || document.webkitExitFullscreen;
        var r = ex && ex.call(document);
        if (r && typeof r.catch === 'function') r.catch(function () {});
      }
      Module.exitFullscreen = exit;
      document.addEventListener('keydown', function (e) {
        if (e.code !== 'KeyF' || e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
        if (!Module.fullscreenKeyOk) return;
        if (current()) exit(); else enter();
      });
    })();

    // Paste: the game cannot read the clipboard (GLFW has none here, and a page
    // may not read it uninvited), but the browser announces a paste the player
    // makes. Park the text for the focused field in the game to take - see
    // PlatformzTakePaste in ui.h, which ignores anything older than half a
    // second. Not preventDefault'ed: nothing on the page is editable, so the
    // browser has nothing else to do with it.
    document.addEventListener('paste', function (e) {
      var t = e.clipboardData && e.clipboardData.getData('text');
      if (t && window.Module) Module.pendingPaste = { text: t, at: Date.now() };
    });

    // Audio unlock: browsers create the Web Audio context suspended until a user
    // gesture. raylib's miniaudio only auto-unlocks on 'click'/'touchend', so a
    // player who starts the game with a key (the title screen accepts any key)
    // never triggers it and the game is silent. Resume every miniaudio device
    // context directly on the first mouse OR key gesture. Left attached so it also
    // re-resumes if the context is suspended after the tab is backgrounded; resume
    // on an already-running context is a cheap no-op.
    (function () {
      function resumeAudio() {
        var ma = window.miniaudio;
        if (!ma || !ma.devices) return;
        ma.devices.forEach(function (d) {
          if (d && d.webaudio && d.webaudio.state !== 'running') d.webaudio.resume();
        });
      }
      ['mousedown', 'keydown', 'touchend'].forEach(function (ev) {
        document.addEventListener(ev, resumeAudio, true);
      });
    })();
  </script>
  {{{ SCRIPT }}}
</body>
</html>
